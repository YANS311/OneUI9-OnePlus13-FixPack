name: CI & Release KernelSU Module

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-test:
    name: ShellCheck & Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ShellCheck on module shell scripts
        run: |
          shellcheck -S warning module/post-fs-data.sh module/service.sh module/uninstall.sh module/scripts/callbridge_auto.sh module/scripts/alert_slider.sh module/scripts/power_guard.sh module/scripts/stealth_lib.sh module/scripts/oneui9_usb.sh

      - name: Syntax check customize.sh
        run: |
          sh -n module/customize.sh

      - name: Compile-check Python patchers
        run: |
          python -m py_compile patchers/*.py tests/*.py

      - name: Run patcher unit tests
        run: |
          python -m unittest discover -s tests -v

  package:
    name: Build Flashable KernelSU Module ZIP
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package KernelSU / Magisk ZIP & SHA256SUMS
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          mkdir -p dist
          ZIP_NAME="OneUI9-OnePlus13-FixPack-${VERSION}.zip"
          (cd module && zip -r9 "../dist/${ZIP_NAME}" .)
          (cd dist && sha256sum "${ZIP_NAME}" > SHA256SUMS.txt)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneUI9-OnePlus13-FixPack
          path: dist/*

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
